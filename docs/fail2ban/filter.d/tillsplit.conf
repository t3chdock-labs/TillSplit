# Fail2Ban-Filter für TillSplit
# TillSplit schreibt jede fehlgeschlagene Anmeldung (Passwort, Zwei-Faktor-Code, Passkey, Einrichtungscode)
# als eigene Zeile ins Container-Protokoll, z. B.:
#   TILLSPLIT_ANMELDUNG_FEHLGESCHLAGEN ip=203.0.113.7 email=max@example.de
# Die IP ist die echte Client-IP, sofern der Reverse Proxy X-Forwarded-For setzt (siehe TRUST_PROXY).

[Definition]
failregex = TILLSPLIT_ANMELDUNG_FEHLGESCHLAGEN ip=<HOST>(?:\s|$|")
ignoreregex =
