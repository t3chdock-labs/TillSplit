# Baut das Docker-Image für amd64 und arm64 und schiebt es nach Docker Hub und GHCR.
# Läuft bei jedem Versions-Tag (v0.1.0, v0.2.3 …) und auf Wunsch von Hand (Actions → Docker-Image → Run workflow).
#
# Vorher im Repository einrichten (Settings → Secrets and variables → Actions):
#   Variable  DOCKERHUB_USERNAME  t3chdocklabs
#   Secret    DOCKERHUB_TOKEN     Docker-Hub-Access-Token mit „Read & Write“
# Für GHCR genügt das eingebaute GITHUB_TOKEN.
name: Docker-Image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: docker.io/t3chdocklabs/tillsplit
  GHCR_IMAGE: ghcr.io/t3chdock-labs/tillsplit

jobs:
  bauen:
    runs-on: ubuntu-latest
    # arm64 läuft über QEMU-Emulation (better-sqlite3 wird kompiliert) – das dauert
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Anmelden bei Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Anmelden bei GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag v0.1.0 -> Image-Tags 0.1.0, 0.1 und latest
      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=TillSplit
            org.opencontainers.image.description=Kassenbons auslesen, auswerten und in Actual Budget aufteilen
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Bauen und hochladen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
